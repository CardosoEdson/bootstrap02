<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <title>Destino Brotas</title>
</head>
<body class="bg-black">

    
    <header class="hero d-flex flex-column justify-content-between p-4"
        style="background: linear-gradient(rgba(0, 0, 0, 0.35), rgba(34, 34, 34, 0.35)), url('./img/banner.png') center/cover no-repeat; min-height: 360px; border-color: 4px solid #f4d03f;">
    
        
       
        <nav class="navbar md:navbar-expand bg-transparent p-0 align-items-start">
            <div class="container-fluid px-2">
             
                <a class="navbar-brand p-0" href="#">
                    <img src="./img/logo.png" alt="Destino Brotas" class="logo-img">
                </a>

                
                <button class="btn-icon navbar-toggler bg-white" type="button" data-bs-toggle="drawer" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon" aria-hidden="true"></span>
                </button>

                
                <dialog class="drawer drawer-end" tabindex="-1" id="navbarNav" aria-labelledby="navbarNavLabel">
                    <div class="drawer-header">
                        <h5 class="drawer-title" id="navbarNavLabel">Menu</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
                    </div>
                    <div class="drawer-body justify-content-end">
                        <ul class="navbar-nav gap-3 mt-2">
                            <li class="nav-item">
                                <a class="nav-link custom-nav active" aria-current="page" href="#">Home</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link custom-nav" href="#passeios">Passeios</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link custom-nav" href="#valores">Preços</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link custom-nav" href="#contato">Contato</a>
                            </li>
                        </ul>
                    </div>
                </dialog>
            </div>
        </nav>

        
        <div class="hero-content text-center mb-5">
            <h1 class="text-white fw-bold fs-2 mb-4 hero-title">AVENTURA E TRANQUILIDADE</h1>
            <div class="hero-buttons d-flex justify-content-center gap-5 flex-wrap">
                <a href="#" class="btn rounded-0 px-5 fw-bold hero-btn">VIDEO</a>
                <a href="#passeios" class="btn rounded-0 px-5 fw-bold hero-btn">LEIA MAIS</a>
            </div>
        </div>
    </header>
    

    <section id="passeios" class="passeios-section">
        <div class="container">
            <h2 class="fs-6 fw-bold text-black mb-4">Passeios</h2>
            
            <div class="row justify-content-center g-5">
              
                <div class="col-auto">
                    <div class="card rounded-0 card-pink custom-card">
                        <img src="./img/turis1.png" class="card-img-top rounded-0" alt="Canoagem">
                        <div class="card-footer custom-card-footer text-white text-center fw-bold py-1">
                            Canoagem
                        </div>
                    </div>
                </div>

              
                <div class="col-auto">
                    <div class="card rounded-0 card-black custom-card">
                        <img src="./img/turis2.png" class="card-img-top rounded-0" alt="Passeio Radical">
                        <div class="card-footer custom-card-footer text-white text-center fw-bold py-1">
                            Passeio Radical
                        </div>
                    </div>
                </div>

              
                <div class="col-auto">
                    <div class="card rounded-0 card-green custom-card">
                        <img src="./img/turis3.png" class="card-img-top rounded-0" alt="Trilhas">
                        <div class="card-footer custom-card-footer text-white text-center fw-bold py-1">
                            Trilhas
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    
    <section id="valores" class="valores-section py-5">
        <div class="container">
            <h2 class="fs-6 fw-bold text-black mb-4">Valores</h2>
            
            <div class="table-responsive mx-auto" style="max-width: 650px;">
                <table class="table table-bordered text-center align-middle mb-0 custom-table">
                    <thead>
                        <tr>
                            <th class="pt-3">Passeios</th>
                            <th class="pt-3">Valores</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Canoagem</td>
                            <td>R$ 60,00</td>
                        </tr>
                        <tr>
                            <td>Passeio Radical</td>
                            <td>R$ 80,00</td>
                        </tr>
                        <tr>
                            <td>Trilhas</td>
                            <td>R$ 90,00</td>
                        </tr>
                    </tbody>
                    <tfoot>
                        <tr>
                            <td colspan="2" class="py-3 fw-bold">
                                Consulte na recepção os valores atualizados
                            </td>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </div>
    </section>

    
    <footer id="contato" class="custom-footer text-white py-3 mt-5">
        <div class="container d-flex justify-content-center align-items-center gap-3 fs-5 fw-bold">
            <svg class="whatsapp-icon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.582 2.128 2.182-.573c.978.58 1.911.928 3.145.929 3.178 0 5.767-2.587 5.768-5.766.001-3.187-2.575-5.77-5.764-5.771zm3.392 8.244c-.144.405-.837.774-1.17.824-.299.045-.677.063-1.092-.069-.252-.08-.575-.187-.988-.365-1.739-.751-2.874-2.502-2.961-2.617-.087-.116-.708-.94-.708-1.793s.448-1.273.607-1.446c.159-.173.346-.217.462-.217l.332.006c.106.005.249-.04.39.298.144.347.491 1.2.534 1.287.043.087.072.188.014.304-.058.116-.087.188-.173.289l-.26.304c-.087.086-.177.18-.076.354.101.174.449.741.964 1.201.662.591 1.221.774 1.394.86s.274.072.376-.043c.101-.116.433-.506.549-.68.116-.173.231-.145.39-.087s1.011.477 1.184.564.289.13.332.202c.045.072.045.419-.1.824z"/>
            </svg>
            <span>Contato: (19) 992124943</span>
        </div>
    </footer>

    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</body>
